<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="CSD 340 Module 10.3 Assignment page" />
  <meta name="keywords" content="CSD 340, HTML, CSS, JavaScript" />
  <meta name="author" content="Jose Velazquez" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CSD 340 Web Development with HTML and CSS</title>

  <script>
    /**
     * Executed when a thumbnail image is clicked (onclick MouseEvent).
     * Updates the main display based on user input.
     */
    function chooseScene(imageFile, titleText, descriptionText) {
      const mainImage = document.getElementById("mainImage");
      const sceneTitle = document.getElementById("sceneTitle");
      const sceneDesc = document.getElementById("sceneDesc");

      if (mainImage) {
        mainImage.src = imageFile;
      }
      if (sceneTitle) {
        sceneTitle.textContent = titleText;
      }
      if (sceneDesc) {
        sceneDesc.textContent = descriptionText;
      }
    }
  </script>
</head>

<body>
  <div id="container">
    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <h2 id="sceneTitle">Click a Scene</h2>
    <p id="sceneDesc">
      Choose an image below to change the main display. Each click updates the image and the story text.
    </p>

    <!-- Main display area -->
    <div class="main-image-wrap">
      <img
        id="mainImage"
        class="mainImage"
        src="scene_default.jpg"
        alt="Selected scene"
        width="420"
        height="280"
      />
    </div>

    <hr />

    <h3>Pick Your Adventure</h3>

    <!-- Thumbnails (use your own graphics/images) -->
    <div class="thumbs">
      <img
        class="thumb"
        src="scene_forest_thumb.jpg"
        alt="Forest scene thumbnail"
        width="140"
        height="90"
        onclick="chooseScene(
          'scene_forest.jpg',
          'Scene 1: The Forest Trail',
          'You step onto a quiet trail where the trees form a tunnel of green overhead. The air feels cooler, and everything is calm.'
        )"
      />

      <img
        class="thumb"
        src="scene_city_thumb.jpg"
        alt="City scene thumbnail"
        width="140"
        height="90"
        onclick="chooseScene(
          'scene_city.jpg',
          'Scene 2: Neon City',
          'Lights flicker across the street as the city comes alive. You hear distant music, passing footsteps, and the buzz of late-night energy.'
        )"
      />

      <img
        class="thumb"
        src="scene_beach_thumb.jpg"
        alt="Beach scene thumbnail"
        width="140"
        height="90"
        onclick="chooseScene(
          'scene_beach.jpg',
          'Scene 3: Sunset Beach',
          'Waves roll in slowly while the sun drops toward the horizon. The sky shifts into warm colors and the day feels like it is exhaling.'
        )"
      />
    </div>

    <p class="note">
      Tip: Replace the image filenames above with your own original graphics (photos you took, drawings, or custom images).
    </p>
  </div>
</body>
</html>
